# /etc/linuxdrv.conf - which PCI devices Linux's drivers run (/bin/linuxdrv, the driver host).
#
# At boot every PCI device no Tessera driver runs goes to Linux (graphics and bridges
# aside); devices no Linux driver takes come back.  Lines here change that:
#
#   never  <vendor>:<device>    keep a device away from Linux
#   always <vendor>:<device>    Linux runs it even though Tessera has a driver
#   linux  <arguments>          more Linux kernel arguments (loglevel=7, a driver's options)
#
# <device> ffff matches every device of the vendor.  Example: give the Panasonic
# FZ-G1's USB 3 controller to Linux, so any USB device works as it does on Linux
# (keyboards, mice and touch come back through the input bridge; Tessera's own USB
# audio and Bluetooth then do not run):
#
#   always 8086:1e31
